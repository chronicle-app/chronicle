name: Prepare npm release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npm run packages:check
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: artifacts/npm/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: schema-release
          path: artifacts/schema/
          if-no-files-found: error
