name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Release tags, for the vocabulary version check.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check generated schema
        run: npm run schema:check
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build schema docs
        run: npm run schema:docs:build
      - name: Upload schema docs
        uses: actions/upload-artifact@v4
        with:
          name: schema-docs
          path: core/schema/build/site
      - name: Check formatting
        run: npm run format:check
      - name: Check package tarballs
        run: npm run packages:check
