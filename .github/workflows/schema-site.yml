name: Schema site

# Deploys schema.chronicle.app from main, with a snapshot of every released
# vocabulary version. It runs on pushes to main that change the schema, and
# `npm run release:approve` starts it after a release so new snapshots appear
# right away.
on:
  push:
    branches: [main]
    paths:
      - core/schema/**
      - .github/workflows/schema-site.yml
  workflow_dispatch:
    inputs:
      skip-published-check:
        description: Skip comparing release snapshots with the live site
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    # Vocabulary work happens on branches; only main is published.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: schema-site
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run docs:build:deploy -w @chronicle.app/schema -- ${{ inputs.skip-published-check && '--skip-published-check' || '' }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: core/schema
          wranglerVersion: '4'
          command: deploy
