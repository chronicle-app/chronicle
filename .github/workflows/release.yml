name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - id: select-mode
        uses: changesets/action/select-mode@v2

  # Opens or updates the Version Packages pull request from pending changesets.
  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - uses: changesets/action/version@v2
        with:
          script: npm run release:version

  # A draft release marks a version that is staged and awaiting approval.
  staged:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.release.outputs.exists }}
    permissions:
      # Draft releases are only visible with write access.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - id: release
        run: |
          if gh release view "v$(node -p "require('./package.json').version")" > /dev/null 2>&1; then
            echo exists=true >> "$GITHUB_OUTPUT"
          else
            echo exists=false >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # Runs the release checks and packs the tarballs the stage job uploads.
  pack:
    if: needs.staged.outputs.exists == 'false'
    needs: staged
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run quality
      - run: npm run packages:check
      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarballs
          path: artifacts/npm/*.tgz
          if-no-files-found: error

  # Stages the tarballs through npm trusted publishing, then creates the draft
  # v<version> release. Nothing is public until `npm run release:approve`.
  stage:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # Staged publishing needs a newer npm than Node.js bundles.
      - run: npm install --global npm@12
      - uses: actions/download-artifact@v8
        with:
          name: npm-tarballs
          path: artifacts/npm
      - run: node scripts/stage-release.js artifacts/npm
      - run: node scripts/tag-release.js --draft
        env:
          GH_TOKEN: ${{ github.token }}
